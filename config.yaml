# ==========================================
# CONFIGURATION - CLASSIFICATION LLRF
# ==========================================


# ----------------------------------
# Paramètres d'exécution
# ----------------------------------
execution:
  combine_csvs: false   # true : résultat dans un seul csv, false : résultat dans un csv par année
  years:                # Année à analyser
    - 2020
    - 2021
    - 2022
    - 2023
    - 2024
    - 2025
    # - 2026


# ----------------------------------
# Filtres de Validité
# ----------------------------------
filters:
  check_beam: true                  # Désactiver pour ignorer l'état du faisceau
  check_loop: true                  # Désactiver pour ignorer l'état de la boucle
  check_kpi: true                   # Désactiver pour ignoner la valeur de KPI
  check_mask: true                  # Désactiver pour ignorer le mask
  check_ampt: true                  # Désactiver pour ignorer la valeur de AMPT
  check_ucav_healthy : true         # Désactiver pour ignorer l'état de la tension
  min_kpi: 10.0                     # KPI minimum pour analyser le fichier
  max_ampt: 10.0                    # AMPT maximum pour analyser le fichier
  ucav_min_healthy: 0.1             # Tension minimale avant défaut pour considérer le signal valide
  ucav_low_max_duration_us: 200.0   # Tolérance (en µs) : Temps max autorisé sous le seuil de tension avant de rejeter le fichier
  

# ----------------------------------
# Seuils par Défaut Majeur
# ----------------------------------
thresholds:
  
  ecav_instability:

    # oscillations
    taconis_max_hz: 100                # Seuil maximun pour qu'une oscillation soit un taconis
    
    min_physical_amp_modiq: 0.1        # Amplitude minimum accepté pour que modIQ oscille
    min_physical_amp_uci: 0.002        # Amplitude minimum accepté pour que Uci oscille
    min_physical_amp_ucav: 0.0001      # Amplitude minimum accepté pour que Ucav oscille

    # Quench 
    fall_target_pct: 1.0            # Objectif de chute (99%)
    min_false_alarm_us: 10000.0     # Limite basse en µs pour une chute normal

    # Peak
    threshold_noise_pct : 10.0     # Pourcentage minimum pour que le pic sorte du bruit
    threshold_peak_pct: 90.0       # Pourcentage pour qu'un pic soit classé "Gain anormal" (Power chain gain)
  
  quench:
    min_false_alarm_us: 1000.0          # Limite basse en µs pour une fausse alarme
    fall_target_pct: 50.0               # Objectif de chute (50%)
  
  rf_protection:
    threshold_ucav_max: 8.5      # Au-delà de ce ratio Ucav/Ucat, c'est un "Ucav max"
    
  vacuum:
    pickup_threshold: 50.0   # En uA