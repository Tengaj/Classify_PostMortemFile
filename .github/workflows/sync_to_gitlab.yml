name: Sync to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        run: |
          git push --mirror https://oauth2:${{ secrets.GITLAB_SECRET }}@gitlab.in2p3.fr/22002019/Classify_PostMortemFile.git